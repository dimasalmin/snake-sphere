<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141210">
<title>Змейка на сфере</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b0f15'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237d93b3' stroke-opacity='.5' stroke-width='1.5'/%3E%3Cpath d='M5 16h22M16 3v26M7 9c5 3 13 3 18 0M7 23c5-3 13-3 18 0' stroke='%237d93b3' stroke-opacity='.45' fill='none'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e0a458'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #141210;
    overflow: hidden;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    color: #e8e2d6;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }

  /* верхняя панель: только цифры */
  #hud {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 24px; align-items: baseline;
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: #8a8375;
    background: rgba(20, 18, 16, .55);
    border: 1px solid rgba(232, 226, 214, .08);
    border-radius: 999px; padding: 9px 24px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    user-select: none; white-space: nowrap;
  }
  #hud b { font-size: 18px; letter-spacing: .04em; color: #e8e2d6; font-weight: 600; margin-left: 7px; }
  #hud .rec b { color: #e0a458; }

  /* оверлей смерти/паузы */
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(10, 9, 7, .66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-align: center; padding: 24px;
  }
  #overlay .t { font-size: 34px; font-weight: 600; letter-spacing: .02em; margin: 0 0 6px; color: #e8e2d6; }
  #overlay .s { font-size: 17px; margin: 0 0 22px; color: #9a9282; }
  #overlay button {
    font-family: inherit; font-size: 15px; letter-spacing: .1em; text-transform: uppercase;
    padding: 12px 34px; border-radius: 999px; cursor: pointer;
    border: 1px solid #e0a458; background: rgba(224, 164, 88, .10); color: #e8c99a;
    transition: background .2s;
  }
  #overlay button:hover { background: rgba(224, 164, 88, .25); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <span>счёт<b id="score">0</b></span>
  <span>длина<b id="len">3</b></span>
  <span class="rec">рекорд<b id="rec">0</b></span>
</div>
<div id="overlay">
  <div class="t" id="ovTitle">Игра окончена</div>
  <div class="s" id="ovText">Счёт: 0</div>
  <button id="btn">Заново</button>
</div>

<script>
(() => {
  'use strict';

  // ---------- DOM (объявлены ДО reset()) ----------
  const canvas  = document.getElementById('c');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const elScore = document.getElementById('score');
  const elLen   = document.getElementById('len');
  const elRec   = document.getElementById('rec');
  const elOvT   = document.getElementById('ovTitle');
  const elOvS   = document.getElementById('ovText');
  const elBtn   = document.getElementById('btn');

  // ---------- векторная математика на единичной сфере ----------
  const V = (x, y, z) => ({ x, y, z });
  const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
  const mul = (a, s) => V(a.x * s, a.y * s, a.z * s);
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const cross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const vlen = a => Math.sqrt(dot(a, a));
  const norm = a => { const l = vlen(a) || 1; return V(a.x / l, a.y / l, a.z / l); };
  // интерполяция по большому кругу: a -> b на долю t
  const slerp = (a, b, t) => {
    const c = Math.max(-1, Math.min(1, dot(a, b)));
    const th = Math.acos(c);
    if (th < 1e-6) return mul(a, 1);
    const s = Math.sin(th);
    return norm(add(mul(a, Math.sin((1 - t) * th) / s), mul(b, Math.sin(t * th) / s)));
  };
  const angBetween = (a, b) => Math.acos(Math.max(-1, Math.min(1, dot(a, b))));
  // вращение вектора вокруг единичной оси ax на угол a (Родригес)
  const rotAxis = (q, ax, a) =>
    add(add(mul(q, Math.cos(a)), mul(cross(ax, q), Math.sin(a))), mul(ax, dot(ax, q) * (1 - Math.cos(a))));

  // ---------- параметры ----------
  const SPEED     = 1.7;   // рад/с — скорость змеи по сфере
  const TURN      = 4.6;   // рад/с — предельная скорость поворота
  const TURN_RAMP = 16.0;  // рад/с² — разгон/торможение руля (быстрый отклик)
  const BODY_ARC  = 0.8;   // дуга тела (в радах) при длине 3; +0.45 за каждую еду

  // ---------- состояние ----------
  let P, D;        // голова и касательное направление
  let trail;       // след: плотные точки, [0] — ближайшая к голове
  let lastSub;     // дуга подшага (для расчёта длины следа)
  let food;
  let score;
  let over;
  let paused = false;
  let turnVel = 0; // текущая «скорость руля»
  let last = performance.now();

  // камера: ортонормальный базис, смотрит на голову (в центр экрана)
  let vx, vy, vz;

  const REC_KEY = 'snake_sphere_rec';
  let best = 0;
  try { best = parseInt(localStorage.getItem(REC_KEY) || '0', 10) || 0; } catch (e) {}

  function reset() {
    P = V(0, 0, 1);
    D = V(1, 0, 0);
    // стартовое тело: дуга BODY_ARC назад по большому кругу.
    // Голова в P=(0,0,1), движется в +x (D=(1,0,0)) => тело в -x.
    // Точка на дуге a позади головы: (-sin a, 0, cos a) — вращение P
    // вокруг оси (0,1,0). Плотная выборка для плавной ленты.
    trail = [];
    const stepArc = Math.PI / 240;
    const n = Math.floor(BODY_ARC / stepArc);
    for (let i = 0; i <= n; i++) {
      const a = i * stepArc;
      trail.push(V(-Math.sin(a), 0, Math.cos(a)));
    }
    score = 0;
    over = false;
    paused = false;
    turnVel = 0;
    vz = norm(P);
    // базис камеры: устойчивый выбор опорного вектора,
    // чтобы не вырождаться у «полюсов» (когда vz ∥ ref)
    let ref = V(0, 1, 0);
    if (Math.abs(vz.y) > 0.98) ref = V(1, 0, 0);
    vx = norm(cross(vz, ref));
    vy = cross(vz, vx);
    spawnFood();
    updateHUD();
    overlay.style.display = 'none';
  }

  function spawnFood() {
    for (let i = 0; i < 200; i++) {
      const u = Math.random() * 2 - 1, ph = Math.random() * Math.PI * 2;
      const r = Math.sqrt(1 - u * u);
      const c = V(r * Math.cos(ph), r * Math.sin(ph), u);
      const a = angBetween(c, P);
      if (a > 0.7 && a < Math.PI - 0.4) { food = c; return; }
    }
    food = mul(P, -1);
  }

  // ---------- ввод ----------
  const key = { L: false, R: false };
  addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft')  { key.L = true;  e.preventDefault(); }
    if (e.code === 'ArrowRight') { key.R = true;  e.preventDefault(); }
    if (e.code === 'Space' && over) reset();
    if (e.code === 'KeyP' && !over) togglePause();
  });
  addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft')  key.L = false;
    if (e.code === 'ArrowRight') key.R = false;
  });

  // сенсор: левая половина экрана — поворот влево, правая — вправо.
  // Простая и интуитивная схема: нажал куда — туда и повернул.
  const setTouch = e => {
    const t = e.touches[0];
    key.L = t.clientX < innerWidth / 2;
    key.R = !key.L;
  };
  addEventListener('touchstart', e => {
    // если на паузе — первый тап её снимает, иначе это уже руление
    if (paused && !over) { togglePause(); return; }
    setTouch(e); e.preventDefault();
  }, { passive: false });
  addEventListener('touchmove', e => { setTouch(e); e.preventDefault(); }, { passive: false });
  addEventListener('touchend', () => { key.L = key.R = false; });

  // тап по экрану при смерти — заново
  addEventListener('click', () => { if (over) reset(); });
  const actBtn = e => { e.stopPropagation(); if (paused && !over) togglePause(); else reset(); };
  elBtn.addEventListener('click', actBtn);
  elBtn.addEventListener('touchend', e => { e.preventDefault(); actBtn(e); }, { passive: false });

  function togglePause() {
    if (over) return;
    paused = !paused;
    if (paused) showOverlay('Пауза', null, 'Далее');
    else { overlay.style.display = 'none'; elBtn.style.display = 'none'; last = performance.now(); }
  }

  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // автопауза при сворачивании вкладки
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !over && !paused) togglePause();
    last = performance.now();
  });

  // ---------- шаг игры ----------
  function step(dt) {
    if (over || paused) return;

    // плавный руль: скорость поворота разгоняется/тормозится без рывков
    const target = (key.R ? 1 : 0) - (key.L ? 1 : 0);
    const rate = TURN_RAMP * dt;
    if (turnVel < target * TURN)      turnVel = Math.min(target * TURN, turnVel + rate);
    else if (turnVel > target * TURN) turnVel = Math.max(target * TURN, turnVel - rate);

    if (turnVel !== 0) {
      // Осью поворота служит радиус P (НЕ D×P): вращение D вокруг P
      // — это именно поворот «вбок» по поверхности сферы (вправо/влево
      // по экрану), а наклон D×P нос лишь наклонял в меридиане.
      // D⊥P сохраняется точно (D·P≈0 на каждом шаге).
      // Знак: +1 (правая половина/стрелка →) уводит нос вправо
      // относительно направления движения, −1 (левая/←) — влево.
      // Минус: базис камеры (vx = vz × ref) «зеркалит» вращение на экране,
      // без него правая половина вела нос влево.
      D = norm(rotAxis(D, P, -turnVel * dt));
    }
    // движение по большому кругу
    const s = SPEED * dt;
    P = norm(add(mul(P, Math.cos(s)), mul(D, Math.sin(s))));
    // страховка: D строго касателен к новому P
    D = norm(sub(D, mul(P, dot(D, P))));

    // след: плотная точка каждый подшаг; длина тела ограничена дугой
    trail.unshift(P);
    lastSub = s;
    const arc = BODY_ARC + score * 0.45;
    const maxPts = Math.ceil(arc / lastSub) + 1;
    if (trail.length > maxPts) trail.length = maxPts;

    // еда
    if (angBetween(P, food) < 0.11) {
      score++;
      if (score > best) { best = score; try { localStorage.setItem(REC_KEY, String(best)); } catch (e) {} }
      buzz(18);
      spawnFood();
      updateHUD();
    }

    // самопересечение: «шея» (первые ~0.35 рад за головой) — это тело
    // самой змеи, в нём быть рядом не страшно (даже в крутом вираже);
    // дальше по следу, если голова замкнула круг и подошла к телу
    // вплотную — смерть.
    const neck = 0.35;
    const hitDist = 0.055;
    let acc = 0;
    for (let i = 1; i < trail.length; i++) {
      acc += angBetween(trail[i - 1], trail[i]);
      if (acc < neck) continue;
      if (angBetween(P, trail[i]) < hitDist) { gameOver(); break; }
    }
  }

  function gameOver() {
    over = true;
    buzz([30, 40, 60]);
    showOverlay('Игра окончена',
      'Счёт: ' + score + (score > 0 && score >= best ? ' · новый рекорд' : ''));
  }

  function showOverlay(title, text, btnText) {
    elOvT.textContent = title;
    elOvS.textContent = text || '';
    elOvS.style.display = text ? 'block' : 'none';
    elBtn.textContent = btnText || 'Заново';
    elBtn.style.display = 'inline-block';
    overlay.style.display = 'flex';
  }

  function updateHUD() {
    elScore.textContent = score;
    elLen.textContent = 3 + score;
    elRec.textContent = best;
  }

  // ---------- отрисовка ----------
  let W, H, R, CX, CY, DPR;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    R = Math.min(W, H) * 0.40;   // сфера целиком в кадре, с полем
    CX = W / 2; CY = H / 2;
  }
  addEventListener('resize', resize);
  resize();

  function project(p) {
    return { x: CX + dot(p, vx) * R, y: CY - dot(p, vy) * R, z: dot(p, vz) };
  }

  // плавный путь: квадратичные кривые Безье через средние точки
  function smoothPath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const l = pts[pts.length - 1];
    ctx.lineTo(l.x, l.y);
  }

  // лента с толщиной по глубине: дальние участки тоньше — ощущение объёма.
  // pts уже отсортированы: [0] — хвост, конец — голова (в центре).
  function strokeRibbon(pts, baseW) {
    const SEG = 3;
    for (let i = 0; i < pts.length - 1; i += SEG) {
      const j = Math.min(i + SEG, pts.length - 1);
      const seg = pts.slice(i, j + 1);
      if (seg.length < 2) continue;
      const d = seg[seg.length - 1].z;          // глубина у головы сегмента
      const w = Math.max(baseW * 0.35, baseW * (0.55 + 0.45 * Math.max(0, d)));
      ctx.strokeStyle = 'rgba(0,0,0,0.30)';
      ctx.lineWidth = w + Math.max(1.5, baseW * 0.14);
      smoothPath(seg); ctx.stroke();            // мягкая тень под лентой
      ctx.strokeStyle = '#e3d5bd';
      ctx.lineWidth = w;
      smoothPath(seg); ctx.stroke();            // шкурка
      ctx.strokeStyle = 'rgba(224, 164, 88, ' + (0.35 + 0.4 * Math.max(0, d)).toFixed(2) + ')';
      ctx.lineWidth = Math.max(1, w * 0.42);
      smoothPath(seg); ctx.stroke();            // янтарный отблеск по центру
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // фон: глубокий тёплый графит
    const bg = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#1a1713');
    bg.addColorStop(0.55, '#141210');
    bg.addColorStop(1, '#0d0c0a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // тёплое свечение-атмосфера позади сферы
    const glow = ctx.createRadialGradient(CX, CY, R * 0.7, CX, CY, R * 1.45);
    glow.addColorStop(0, 'rgba(224, 164, 88, 0.07)');
    glow.addColorStop(1, 'rgba(224, 164, 88, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // тело сферы: тёплый свет сверху-слева
    const sg = ctx.createRadialGradient(CX - R * 0.38, CY - R * 0.42, R * 0.08, CX, CY, R * 1.02);
    sg.addColorStop(0, '#2c2620');
    sg.addColorStop(0.45, '#221e19');
    sg.addColorStop(0.8, '#191613');
    sg.addColorStop(1, '#12100d');
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.fillStyle = sg; ctx.fill();

    // сетка меридианов/параллелей — тонкая, показывает вращение сферы
    ctx.lineWidth = 1;
    for (let lat = -60; lat <= 60; lat += 30) {
      const la = lat * Math.PI / 180, r = Math.cos(la), y = Math.sin(la);
      let prev = null;
      for (let i = 0; i <= 48; i++) {
        const th = i / 48 * Math.PI * 2;
        const p = project(V(r * Math.cos(th), y, r * Math.sin(th)));
        if (prev && prev.z > -0.02 && p.z > -0.02) {
          const a = Math.min(prev.z, p.z);
          ctx.strokeStyle = 'rgba(232, 226, 214, ' + (0.03 + 0.10 * Math.max(0, a)).toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
        prev = p;
      }
    }
    for (let lon = 0; lon < 180; lon += 30) {
      const lo = lon * Math.PI / 180;
      let prev = null;
      for (let i = 0; i <= 48; i++) {
        const th = i / 48 * Math.PI * 2;
        const p = project(V(Math.cos(th) * Math.cos(lo), Math.sin(th), Math.cos(th) * Math.sin(lo)));
        if (prev && prev.z > -0.02 && p.z > -0.02) {
          const a = Math.min(prev.z, p.z);
          ctx.strokeStyle = 'rgba(232, 226, 214, ' + (0.03 + 0.10 * Math.max(0, a)).toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
        prev = p;
      }
    }

    // ободок сферы
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(232, 226, 214, 0.28)';
    ctx.lineWidth = 1.2; ctx.stroke();

    // ---- предметы на поверхности: еда и тело, отсортированы по глубине ----
    const items = [{ pt: food, food: true }];
    for (let i = 0; i < trail.length; i++) items.push({ pt: trail[i], food: false });
    for (const it of items) it.proj = project(it.pt);
    items.sort((a, b) => a.proj.z - b.proj.z);

    const t = performance.now() / 1000;
    const pulse = reducedMotion ? 1 : 1 + 0.22 * Math.sin(t * 3);

    // отрисовка по глубине: дальнее раньше
    const bodyPts = [];
    for (const it of items) {
      const p = it.proj;
      if (p.z < -0.12) continue;   // за сферой — не рисуем
      const depth = Math.max(0, p.z);
      if (it.food) {
        const r = (R * 0.05) * (0.55 + 0.45 * depth) * pulse;
        ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(226, 118, 90, ' + (0.10 + 0.18 * depth).toFixed(3) + ')'; ctx.fill();
        const fg = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.1, p.x, p.y, r);
        fg.addColorStop(0, '#f5b28c');
        fg.addColorStop(0.6, '#e2765a');
        fg.addColorStop(1, '#b4543e');
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = fg; ctx.fill();
      } else {
        bodyPts.push(p);
      }
    }

    // ---- тело: плавная лента с толщиной по глубине, хвост -> голова ----
    if (bodyPts.length >= 2) {
      bodyPts.reverse();            // [0] — хвост, конец — у головы
      const head = { x: CX, y: CY, z: 1 };
      bodyPts.push(head);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      strokeRibbon(bodyPts, R * 0.088);
    }

    // ---- голова: всегда в центре ----
    const hr = R * 0.075;
    const halo = ctx.createRadialGradient(CX, CY, hr * 0.8, CX, CY, hr * 2.4);
    halo.addColorStop(0, 'rgba(224, 164, 88, 0.16)');
    halo.addColorStop(1, 'rgba(224, 164, 88, 0)');
    ctx.beginPath(); ctx.arc(CX, CY, hr * 2.4, 0, Math.PI * 2);
    ctx.fillStyle = halo; ctx.fill();

    const hg = ctx.createRadialGradient(CX - hr * 0.35, CY - hr * 0.35, hr * 0.1, CX, CY, hr);
    hg.addColorStop(0, '#f2e6cf');
    hg.addColorStop(0.55, '#e3d5bd');
    hg.addColorStop(1, '#c9b48e');
    ctx.beginPath(); ctx.arc(CX, CY, hr, 0, Math.PI * 2);
    ctx.fillStyle = hg; ctx.fill();
    ctx.beginPath(); ctx.arc(CX, CY, hr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(224, 164, 88, 0.55)';
    ctx.lineWidth = 1.4; ctx.stroke();

    // глаза — смотрят по D; боковой вектор = P × D (касательный)
    const side = cross(P, D);
    const dx = CX + dot(D, vx) * hr * 0.45;
    const dy = CY - dot(D, vy) * hr * 0.45;
    const px = CX + dot(side, vx) * hr * 0.38;
    const py = CY - dot(side, vy) * hr * 0.38;
    for (const sgn of [1, -1]) {
      ctx.beginPath();
      ctx.arc(dx + sgn * px, dy + sgn * py, Math.max(1.2, hr * 0.17), 0, Math.PI * 2);
      ctx.fillStyle = '#3a2e1e'; ctx.fill();
    }

    // короткая стрелка направления впереди головы
    const n1 = norm(add(D, mul(P, 0.5)));
    const a1 = project(n1);
    if (a1.z > 0.05) {
      const tx = CX + (a1.x - CX) * 0.30, ty = CY + (a1.y - CY) * 0.30;
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(tx, ty);
      ctx.strokeStyle = 'rgba(224, 164, 88, 0.5)';
      ctx.lineWidth = 2; ctx.stroke();
    }
  }

  // ---------- главный цикл ----------
  reset();
  function frame(t) {
    let dt = (t - last) / 1000;
    last = t;
    dt = Math.min(dt, 0.05);   // защита от рывка после зависшего фрейма

    // фиксированный подшаг: стабильная физика на любом FPS
    const nSub = Math.max(1, Math.ceil(dt / (1 / 120)));
    for (let i = 0; i < nSub && !over; i++) step(dt / nSub);

    // плавный доворот камеры на голову (экспоненциальное демпфирование)
    if (!paused) {
      const k = 1 - Math.exp(-10 * dt);
      const th = angBetween(vz, P);
      if (th > 1e-9) {
        const ax = norm(cross(vz, P));
        const s = th * k;
        vx = norm(rotAxis(vx, ax, s));
        vy = rotAxis(vy, ax, s);
        vz = rotAxis(vz, ax, s);
        vx = norm(sub(vx, mul(vz, dot(vx, vz))));
        vy = cross(vz, vx);
      }
    }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
